<div class="layout auth-layout">
    <form id="resetForm" class="auth-card" autocomplete="on">
        <div class="auth-title">Reset password</div>

        <div id="resetMsg" class="auth-msg" hidden></div>

        <label class="auth-label">New password</label>
        <input id="newPassword" class="auth-input" type="password" autocomplete="new-password" />

        <label class="auth-label">Confirm</label>
        <input id="newPassword2" class="auth-input" type="password" autocomplete="new-password" />

        <div class="auth-actions">
        <button id="resetBtn" class="auth-btn auth-btn-primary" type="submit">Update</button>
        </div>
    </form>
</div>
