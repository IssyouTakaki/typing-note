<div class="layout auth-layout">
    <form id="resetForm" class="auth-card" autocomplete="on">
      <div class="auth-title">新しいパスワードを設定</div>
  
      <div class="auth-help">
        新しいパスワードを入力してください。<br />
        8文字以上で、英大文字・英小文字・数字・記号を各1文字以上含めてください。
      </div>
  
      <div id="resetMsg" class="auth-msg" hidden></div>
  
      <label class="auth-label">新しいパスワード</label>
      <input id="newPassword" class="auth-input" type="password" autocomplete="new-password" />
  
      <label class="auth-label">新しいパスワード（確認）</label>
      <input id="newPassword2" class="auth-input" type="password" autocomplete="new-password" />
  
      <div class="auth-actions auth-actions-stack-mobile">
        <button id="resetBtn" class="auth-btn auth-btn-primary" type="submit">パスワードを更新</button>
        <button id="goSigninAfterResetBtn" class="auth-btn auth-btn-secondary" type="button" hidden>
          Sign In へ進む
        </button>
      </div>
    </form>
  </div>
