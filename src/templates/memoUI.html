<div class="layout">
    <div class="app-top">
        <header class="header">
            <div class="topbar">
                <div class="title">TypingNote</div>
                <div class="sub">Editor / Explorer</div>

                <div id="authActions" class="header-auth" style="margin-left: auto">
                    <button id="signupBtn" class="btn btn-auth-secondary" type="button">Create Account</button>
                    <button id="signinBtn" class="btn btn-auth-primary" type="button">Sign in</button>
                    <span id="displayNameText" class="header-display-name" hidden></span>
                    <button id="accountSettingsBtn" class="btn btn-auth-secondary" type="button" hidden>
                        Account settings
                    </button>
                    <button id="logoutBtn" class="btn btn-logout" type="button" hidden>Logout</button>
                </div>
            </div>

            <nav class="tabbar" aria-label="tabs">
                <div class="tablist" id="tabList" role="tablist" aria-label="Tabs"></div>
                <div class="tabbar-spacer" aria-hidden="true"></div>
                <div class="tab-actions" aria-label="controls">
                    <button class="tab util" id="newTabBtn" type="button" aria-label="New Memo">+</button>
                    <button class="tab util" id="openExplorerBtn" type="button" aria-label="Open Explorer">EXPLORER</button>
                    <button class="tab util" id="openDustBtn" type="button" aria-label="Open Dust">DUST</button>
                </div>
            </nav>
        </header>

        <div id="msgBar" class="msgbar" aria-live="polite" aria-atomic="true">
            <span id="msgText" class="msgtext"></span>
        </div>


        <div id="searchBar" class="searchbar" hidden>
            <input id="searchInput" class="search-input" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
            <button id="searchClearBtn" class="search-clear" type="button" aria-label="Clear search" hidden>×</button>
        </div>
    </div>
  
    <main class="main">
        <section id="editorView" class="view">
            <div class="panes">
                <div id="presudoTagBar" class="tagbar">
                    <div class="tagbar-label">Tags</div>
                    <div id="pseudoTagList" class="taglist" aria-label="tags"></div>
                </div>
                <section class="pane pane-left">
                    <div class="pane-header">Input</div>
                    <textarea id="memoInput" class="textarea" spellcheck="false"></textarea>
                    <div id="tagSuggest" class="tag-suggest" role="listbox" aria-label="Tag suggestions" hidden></div>
        </section>

                <section class="pane pane-right">
                    <div class="pane-header">Preview</div>
                    <div id="memoPreview" class="preview"></div>
                </section>
            </div>
        </section>
  
        <section id="explorerView" class="view" hidden>
            <div style="display: flex; gap: 8px; align-items: center; padding: 8px 0">
                <!-- <button id="reloadBtn" class="btn" type="button">Reload</button> -->
                <span id="listState" style="font-size: 12px; color: #666"></span>
            </div>
            <ul id="memoList" style="list-style: none; padding: 0; margin: 0"></ul>
        </section>

        <section id="dustView" class="view" hidden>
            <div style="display: flex; gap: 8px; align-items: center; padding: 8px 0">
              <span id="dustState" style="font-size: 12px; color: #666"></span>
            </div>
            <ul id="dustList" style="list-style: none; padding: 0; margin: 0"></ul>
          </section>          
    </main>
</div>
