<div class="layout auth-layout">
    <form id="forgotPasswordForm" class="auth-card" autocomplete="on">
      <div class="auth-title">パスワード再設定</div>
  
      <div class="auth-help">
        登録済みのメールアドレスを入力してください。<br />
        パスワード再設定用リンクを送信します。
      </div>
  
      <div id="forgotPasswordMsg" class="auth-msg" hidden></div>
  
      <label class="auth-label">メールアドレス</label>
      <input id="forgotPasswordEmail" class="auth-input" type="email" autocomplete="email" />
  
      <div class="auth-actions auth-actions-stack-mobile">
        <button id="forgotPasswordSubmitBtn" class="auth-btn auth-btn-primary" type="submit">
          再設定リンクを送信
        </button>
        <button id="forgotPasswordBackBtn" class="auth-btn auth-btn-secondary" type="button">
          Sign In に戻る
        </button>
      </div>
  
      <button id="forgotPasswordTopBtn" class="auth-btn auth-btn-link" type="button">
        TypingNote に戻る
      </button>
    </form>
  </div>
