<div class="layout auth-layout">
  <div class="auth-card admin-analytics-card">
    <div class="auth-title">Admin</div>
    <div class="auth-help">TypingNote analytics summary</div>

    <div id="adminAnalyticsMsg" class="auth-msg" hidden></div>

    <section class="admin-analytics-section">
      <div class="account-section-title">Totals</div>
      <div id="adminAnalyticsTotals" class="admin-analytics-grid"></div>
    </section>

    <section class="admin-analytics-section">
      <div class="account-section-title">Events</div>
      <div id="adminAnalyticsWindows" class="admin-analytics-windows"></div>
    </section>

    <div id="adminAnalyticsNote" class="auth-note" hidden></div>

    <div class="auth-actions auth-actions-stack-mobile">
      <button id="adminAnalyticsRefreshBtn" class="auth-btn auth-btn-primary" type="button">
        Refresh
      </button>
      <button id="adminAnalyticsBackBtn" class="auth-btn auth-btn-secondary" type="button">
        Back to Account settings
      </button>
    </div>
  </div>
</div>
